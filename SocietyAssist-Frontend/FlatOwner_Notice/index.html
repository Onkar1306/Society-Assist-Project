<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin-Notice</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <!-- Sidebar -->
    <div id="sidebar" class="sidebar">
        <div class="app-title">Society Assist</div>
        
        <a href="/FlatOwner_Dashboard/index.html" class="nav-item">
            <i class="fas fa-tachometer-alt nav-icon"></i>
            <span class="nav-text">Dashboard</span>
        </a>
        
        <a href="/FlatOwner_Notice/index.html" class="nav-item active">
            <i class="fas fa-clipboard-list nav-icon"></i>
            <span class="nav-text">Notices</span>
        </a>
        
        <a href="/FlatOwner_Complaint/index.html" class="nav-item">
            <i class="fas fa-exclamation-circle nav-icon"></i>
            <span class="nav-text">Complaints</span>
        </a>
        
        <div class="logout-container">
            <button class="logout-btn" id="logoutBtn">
                <i class="fas fa-sign-out-alt logout-icon"></i>
                <span class="nav-text">Logout</span>
            </button>
        </div>
    </div>
    
    <!-- Main Content -->
    <div id="content" class="content">
        <div class="container">
            <div class="header-container">
                <h1>List Of Notices</h1>
            </div>
            
            <div class="table-container">
                <table id="noticeTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Subject</th>
                            <th>Description</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Notice data will be dynamically inserted -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
