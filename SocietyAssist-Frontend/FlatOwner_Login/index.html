<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Flat Owner Login</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="nav-container">
      <div class="nav-brand">
        <i class="fas fa-building"></i>
        <span>Society Assist</span>
      </div>
      <ul class="nav-links">
        <li><a href="#" class="nav-link"><i class="fas fa-home"></i> <span>Home</span></a></li>
        <li><a href="#" class="nav-link"><i class="fas fa-info-circle"></i> <span>About</span></a></li>
        <li><a href="#" class="nav-link active"><i class="fas fa-user"></i> <span>Resident</span></a></li>
      </ul>
    </div>
  </nav>
  
  <!-- Hero Section -->
  <section class="hero">
    <div class="hero-content">
      <h1>Resident Portal</h1>
      <p>Access your society dashboard to view notices, raise complaints, and manage payments.</p>
    </div>
  </section>

  <!-- Auth Section -->
  <div class="auth-container">
    <div class="auth-box">
      <div class="auth-header">
        <div class="auth-logo">Resident Login</div>
        <div class="auth-subtitle">Sign in to your society account</div>
      </div>
      
      <!-- Login Form -->
      <form id="flatOwnerLoginForm">
        <div class="form-group">
          <label class="form-label" for="login-flatno">Flat Number</label>
          <div class="input-with-icon">
            <i class="fas fa-home input-icon"></i>
            <input type="text" class="form-input" id="login-flatno" placeholder="A-101" value="A-101" required>
          </div>
        </div>
        
        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <div class="input-with-icon">
            <i class="fas fa-lock input-icon"></i>
            <input type="password" class="form-input" id="login-password" placeholder="Enter your password" value="securepassword" required>
            <button type="button" class="password-toggle" id="login-toggle-password">
              <i class="fas fa-eye"></i>
            </button>
          </div>
        </div>
        
        <div class="form-group">
          <button type="submit" class="form-button">Log In</button>
        </div>
        
        <div class="form-footer">
          <a href="#" class="form-link">Forgot password?</a>
        </div>
      </form>
    </div>
  </div>
  
  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <p>&copy; 2025 Society Assist. All rights reserved.</p>
    </div>
  </footer>
</body>
</html>
