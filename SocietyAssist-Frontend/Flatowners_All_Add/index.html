<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flat Owner Management</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <!-- Sidebar -->
    <div id="sidebar" class="sidebar">
        <div class="app-title">Society Assist</div>
        
        <a href="/Admin_Dashboard/index.html" class="nav-item">
            <i class="fas fa-tachometer-alt nav-icon"></i>
            <span class="nav-text">Dashboard</span>
        </a>
        
        <a href="/Admin_Notice_Sidebar/index.html" class="nav-item">
            <i class="fas fa-clipboard-list nav-icon"></i>
            <span class="nav-text">Notices</span>
        </a>
        
        <a href="/Admin_Complaints/index.html" class="nav-item">
            <i class="fas fa-exclamation-circle nav-icon"></i>
            <span class="nav-text">Complaints</span>
        </a>
        
        <a href="/Flatowners_All_Add/index.html" class="nav-item">
            <i class="fas fa-users nav-icon"></i>
            <span class="nav-text">FlatOwners</span>
        </a>
        
        <div class="logout-container">
            <button class="logout-btn" id="logoutBtn">
                <i class="fas fa-sign-out-alt logout-icon"></i>
                <span class="nav-text">Logout</span>
            </button>
        </div>
    </div>

    <!-- Main Content -->
    <div id="content" class="content">
        <div class="container">
            <div class="header-container">
                <h1>List Of FlatOwners</h1>
                <button id="addFlatOwnerBtn" class="add-btn">Add Flat Owner</button>
            </div>
            
            <div class="table-container">
                <table id="usersTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>FlatNo.</th>
                            <th>Owner_Name</th>
                            <th>Phone</th>
                            <th>Email</th>
                            <th>Password</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Users data will be dynamically inserted -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    
    <!-- Modal for adding flat owner -->
    <div id="addFlatOwnerModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Add New Flat Owner</h2>
            <form id="addFlatOwnerForm">
                <div class="form-group">
                    <label for="flatNo">Flat Number:</label>
                    <input type="text" id="flatNo" name="flatNo" required>
                </div>
                <div class="form-group">
                    <label for="ownerName">Owner Name:</label>
                    <input type="text" id="ownerName" name="ownerName" required>
                </div>
                <div class="form-group">
                    <label for="phone">Phone:</label>
                    <input type="text" id="phone" name="phone" required>
                </div>
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="submit-btn">Submit</button>
            </form>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
